<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2a4a">
<title>BTC 스트리트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1e2a4a;font-family:Pretendard,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.chip{background:#0b0e11d9;border:2px solid #fcd53566;border-radius:6px;padding:5px 9px;font-weight:800;font-size:14px;white-space:nowrap}
.chip b{color:#fcd535}
.chip.r{margin-left:auto}
.back{pointer-events:auto;color:#fff;text-decoration:none}
#net i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#888;margin-right:5px;vertical-align:1px}
#net.on i{background:#0ecb81;box-shadow:0 0 6px #0ecb81}
#pop{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 50px);transform:translate(-50%,-10px);min-width:240px;max-width:92vw;background:#0b0e11f0;border:2px solid #fcd535;border-radius:8px;padding:10px 16px;text-align:center;opacity:0;transition:.18s;pointer-events:none}
#pop.on{opacity:1;transform:translate(-50%,0)}
#pop .t{font-size:13px;color:#fcd535;font-weight:800}
#pop .v{font-size:30px;font-weight:900;line-height:1.15;margin:2px 0;font-variant-numeric:tabular-nums}
#pop .s{font-size:13px;color:#c9ced6}
#joy{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:#0006;border:3px solid #fcd53555;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fcd535;box-shadow:0 0 18px #fcd53588}
.btn{position:fixed;border:0;border-radius:14px;font:900 16px Pretendard,sans-serif;touch-action:none;color:#0b0e11}
.btn:active{transform:translateY(2px)}
#jump{right:calc(18px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:82px;height:82px;background:#0ecb81}
#boardBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(182px + env(safe-area-inset-bottom));width:82px;height:48px;background:#46ff6e}
#big{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;z-index:6}
#big.on{display:flex}
#bigC{width:100%;max-height:78vh;object-fit:contain;border:4px solid #2a2d33;border-radius:6px}
#big p{margin:0;color:#9aa3ae;font-size:13px}
#bigX{font:800 16px Pretendard,sans-serif;border:0;border-radius:8px;padding:10px 26px;background:#ffd23a;color:#111}
#chatBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(124px + env(safe-area-inset-bottom));width:82px;height:48px;background:#fcd535}
#log{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(166px + env(safe-area-inset-bottom));width:min(68vw,330px);display:flex;flex-direction:column;gap:4px;pointer-events:none}
#log div{background:#0b0e11cc;border-radius:6px;padding:4px 9px;font-size:13.5px;line-height:1.4;word-break:break-all;transition:opacity 1s}
#log b{color:#fcd535;margin-right:6px}
#log .sys{color:#9aa3ae;font-size:12.5px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0b0e11f2;display:none;gap:8px;z-index:5}
#bar.on{display:flex}
#bar input{flex:1;min-width:0;font:16px Pretendard,sans-serif;padding:10px 12px;border-radius:8px;border:2px solid #fcd535;background:#181a20;color:#fff;outline:none}
#bar button{font:800 15px Pretendard,sans-serif;border:0;border-radius:8px;padding:0 14px;background:#fcd535;color:#0b0e11}
#bar .x{background:#2b3139;color:#fff}
.tag{position:fixed;left:0;top:0;text-align:center;pointer-events:none;white-space:nowrap;display:none}
.tag .nm{display:inline-block;font-size:12px;font-weight:800;background:#0b0e11b3;padding:1px 7px;border-radius:4px}
.tag .me{color:#fcd535}
.tag .bub{display:block;max-width:200px;white-space:normal;word-break:break-all;background:#fff;color:#111;font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:10px;margin:0 auto 5px;position:relative}
.tag .bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.help{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11.5px;color:#fff9;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .5s}
#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#1e2a4a,#7a3f3a);z-index:9;padding:20px}
#start .box{width:min(92vw,360px);background:#0b0e11ee;border:2px solid #fcd535;border-radius:14px;padding:22px;text-align:center}
#start h1{margin:0 0 4px;font-size:26px;color:#fcd535}
#start p{margin:0 0 16px;color:#c9ced6;font-size:14px;line-height:1.5}
#start input{width:100%;font:17px Pretendard,sans-serif;padding:12px;border-radius:8px;border:2px solid #2b3139;background:#181a20;color:#fff;text-align:center;outline:none}
#start input:focus{border-color:#fcd535}
#start button{width:100%;margin-top:10px;font:900 17px Pretendard,sans-serif;padding:13px;border:0;border-radius:8px;background:#fcd535;color:#0b0e11}
#start small{display:block;margin-top:12px;color:#848e9c;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="chip back" href="./">← 현황판</a>
  <div class="chip">BTC <b id="hp">–</b></div>
  <div class="chip r" id="net"><i></i><span id="netT">오프라인</span></div>
  <div class="chip">코인 <b id="score">0</b></div>
</div>
<div id="tags"></div>
<div id="log"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="boardBtn">전광판</button>
<button class="btn" id="chatBtn">채팅</button>
<div id="big"><canvas id="bigC" width="2048" height="1024"></canvas><p>폰을 가로로 돌리면 더 크게 보여요</p><button id="bigX">닫기</button></div>
<button class="btn" id="jump" aria-label="점프">점프</button>
<form id="bar"><input id="msg" maxlength="80" placeholder="메시지 입력" autocomplete="off" enterkeyhint="send"><button type="submit">보내기</button><button type="button" class="x" id="barX">닫기</button></form>
<div class="help" id="help">조이스틱 이동 · 드래그로 시점 회전 · 전광판 버튼으로 크게 보기</div>
<div id="start"><form class="box" id="startF">
  <h1>BTC 스트리트</h1>
  <p>월가 거리에서 시세 전광판을 둘러보고<br>친구와 채팅해요.</p>
  <input id="nick" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
  <button type="submit">입장하기</button>
  <small>채팅은 무료 공개 중계 서버를 거쳐요.<br>개인 정보나 비밀번호는 쓰지 마세요.</small>
</form></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
if(!window.THREE){document.querySelector('#start p').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요.';throw 0}

/* ================= 시세 ================= */
const D={bn:0,bnP:0,ub:0,ubP:0,usdt:0,usdtP:0,coins:{}};
const KEY='btc-athlow-v1',BASE={ath:126273,athDate:'2025-10-06',low:55130,lowDate:'2026-11-21'};
let S={...BASE};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.ath>=BASE.ath)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const todayKST=()=>new Date(Date.now()+9*3600000).toISOString().slice(0,10);
const dayN=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/86400000;
const fmtD=s=>s.slice(0,4)+'.'+(+s.slice(5,7))+'.'+(+s.slice(8,10));
const sign=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const usd=v=>'$'+Math.round(v).toLocaleString('en-US');
const krw=v=>'₩'+Math.round(v).toLocaleString('ko-KR');
function newPrice(p,d){if(p>S.ath){S.ath=p;S.athDate=d;S.low=null;S.lowDate=null;return true}
  if(d>S.athDate&&(S.low==null||p<S.low)){S.low=p;S.lowDate=d;return true}return false}
let dirty=true;
function onBn(c,P){D.bn=c;D.bnP=P;if(typeof live15==='function')live15(c);$('hp').textContent=usd(c);if(newPrice(c,todayKST()))save();dirty=true}
function upbit(){let ws;try{ws=new WebSocket('wss://api.upbit.com/websocket/v1')}catch(e){return}
  ws.binaryType='arraybuffer';
  ws.onopen=()=>ws.send(JSON.stringify([{ticket:'v-'+Date.now()},{type:'ticker',codes:['KRW-BTC','KRW-USDT']}]));
  ws.onmessage=e=>{try{const x=JSON.parse(typeof e.data==='string'?e.data:new TextDecoder().decode(e.data));
    if(x.code==='KRW-BTC'){D.ub=x.trade_price;D.ubP=x.signed_change_rate*100}if(x.code==='KRW-USDT'){D.usdt=x.trade_price;D.usdtP=x.signed_change_rate*100}else if(x.code!=='KRW-BTC')D.coins[x.code]={p:x.trade_price,r:x.signed_change_rate*100};dirty=true}catch(er){}};
  ws.onclose=()=>setTimeout(upbit,3000)}
const bnUrls=['wss://stream.binance.com:9443/ws/btcusdt@ticker','wss://data-stream.binance.vision/ws/btcusdt@ticker'];let bi=0,got=false;
function binance(){let ws;try{ws=new WebSocket(bnUrls[bi%2])}catch(e){return}
  ws.onmessage=e=>{try{const x=JSON.parse(e.data);got=true;onBn(+x.c,+x.P)}catch(er){}};
  ws.onclose=()=>{if(!got)bi++;setTimeout(binance,3000)}}
async function sync(){for(const h of['https://api.binance.com','https://data-api.binance.vision']){
  try{const r=await fetch(h+'/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&startTime='+Date.UTC(2025,9,6));if(!r.ok)continue;
    let ch=false;for(const k of await r.json()){const d=new Date(k[0]).toISOString().slice(0,10);if(d<S.athDate)continue;
      if(+k[2]>S.ath){S.ath=+k[2];S.athDate=d;S.low=null;S.lowDate=null;ch=true;continue}
      if(d>S.athDate&&(S.low==null||+k[3]<S.low)){S.low=+k[3];S.lowDate=d;ch=true}}
    if(ch)save();dirty=true;return}catch(e){}}}
upbit();binance();sync();setInterval(sync,600000);
function boards(){
  const k=D.ub&&D.bn&&D.usdt?(D.ub/(D.bn*D.usdt)-1)*100:null,t=dayN(todayKST());
  const dd=D.bn?(D.bn/S.ath-1)*100:null,fl=D.bn&&S.low?(D.bn/S.low-1)*100:null;
  return[
    {t:'BINANCE  BTC/USDT',v:D.bn?usd(D.bn):'연결 중',s:D.bn?sign(D.bnP)+' 24h':'',c:D.bnP>=0?'#ff4636':'#3aa0ff'},
    {t:'UPBIT  BTC/KRW',v:D.ub?krw(D.ub):'연결 중',s:D.ub?sign(D.ubP)+' 24h':'',c:D.ubP>=0?'#ff4636':'#3aa0ff'},
    {t:'김치프리미엄',v:k==null?'계산 중':sign(k),s:D.usdt?'USDT '+krw(D.usdt):'',c:'#fcd535'},
    {t:'ATH '+usd(S.ath),v:dd==null?'–':sign(dd),s:fmtD(S.athDate)+' · '+(t-dayN(S.athDate))+'일 지남',c:'#f6465d'},
    {t:'ATH 이후 저점 '+(S.low?usd(S.low):'–'),v:fl==null?'–':sign(fl),s:S.low?fmtD(S.lowDate)+' · ATH 후 '+(dayN(S.lowDate)-dayN(S.athDate))+'일째':'',c:'#0ecb81'}]}

/* ================= 3D 월가 거리 ================= */
const cv=$('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));
const scene=new THREE.Scene();
function cTex(w,h,fn,near){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  if(near){t.magFilter=t.minFilter=THREE.NearestFilter}return t}
scene.background=cTex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#141b33');gr.addColorStop(.45,'#3b3f6b');gr.addColorStop(.75,'#c06a5a');gr.addColorStop(1,'#f2a76b');g.fillStyle=gr;g.fillRect(0,0,w,h)});
scene.fog=new THREE.Fog('#b0706a',34,90);
const cam=new THREE.PerspectiveCamera(55,1,.1,300);
scene.add(new THREE.HemisphereLight('#ffd6b8','#2a2d36',1.0));
const sun=new THREE.DirectionalLight('#ffb27a',1.3);sun.position.set(-20,14,12);scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const BOX=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(BOX,typeof c==='string'?M(c):c);m.scale.set(w,h,d);m.position.set(x,y,z);(parent||scene).add(m);return m}
const glow=c=>new THREE.MeshBasicMaterial({color:c});

/* 바닥: 보도 + 도로 */
const walkTex=cTex(32,32,(g)=>{g.fillStyle='#8f939b';g.fillRect(0,0,32,32);g.fillStyle='#7d8189';g.fillRect(0,0,32,2);g.fillRect(0,0,2,32);
  for(let i=0;i<30;i++){g.fillStyle=i%2?'#9aa0a8':'#868a92';g.fillRect(Math.random()*32|0,Math.random()*32|0,2,1)}},true);
const roadTex=cTex(32,32,(g)=>{g.fillStyle='#2a2c31';g.fillRect(0,0,32,32);for(let i=0;i<60;i++){g.fillStyle=['#33363c','#24262a','#3a3d43'][i%3];g.fillRect(Math.random()*32|0,Math.random()*32|0,2,1)}},true);
const walkM=new THREE.MeshLambertMaterial({map:walkTex}),roadM=new THREE.MeshLambertMaterial({map:roadTex});
const XN=60,ZMIN=-30,ZMAX=30;
const tW=new THREE.InstancedMesh(BOX,walkM,XN*(ZMAX-ZMIN)),tR=new THREE.InstancedMesh(BOX,roadM,XN*(ZMAX-ZMIN));
let wi=0,ri=0;const mtx=new THREE.Matrix4();
const isRoad=z=>z>6&&z<12;
for(let x=-XN/2;x<XN/2;x++)for(let z=ZMIN;z<ZMAX;z++){mtx.makeTranslation(x+.5,-.5,z+.5);if(isRoad(z+.5))tR.setMatrixAt(ri++,mtx);else tW.setMatrixAt(wi++,mtx)}
tW.count=wi;tR.count=ri;scene.add(tW,tR);
for(let x=-29;x<30;x+=3)box(1.4,.03,.18,glow('#e8c547'),x,.02,9);
box(60,.25,.3,'#b9bcc2',0,.12,6);box(60,.25,.3,'#b9bcc2',0,.12,12);

/* 빌딩 (창문 불빛) */
const winTex=[0,1,2].map(v=>cTex(32,32,(g)=>{g.fillStyle='#000';g.fillRect(0,0,32,32);
  for(let y=2;y<32;y+=8)for(let x=2;x<32;x+=8){const r=Math.random();g.fillStyle=r<.35+v*.12?'#ffd27a':r<.8?'#22304a':'#3b4a6a';g.fillRect(x,y,5,5)}},true));
const colliders=[],rects=[];
function bldg(x,z,w,d,h,tint,v){
  const t=winTex[v%3].clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(Math.max(1,Math.round(w/2)),Math.round(h/2));
  const side=new THREE.MeshLambertMaterial({color:tint,map:t,emissive:'#ffffff',emissiveMap:t,emissiveIntensity:.55});
  const top=M('#2b2f36');
  const m=new THREE.Mesh(BOX,[side,side,top,top,side,side]);m.scale.set(w,h,d);m.position.set(x,h/2,z);scene.add(m);
  box(w*.3,1.2,d*.3,'#3a3f47',x,h+.6,z);
  rects.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2})}
const tints=['#c9d3e6','#e6d3c0','#b8c4d6','#d8d8d8','#c2b8a8'];
let bv=0;
for(let x=-27;x<=27;x+=6.2){bldg(x,17.5,5.4,6,12+((x*7)%13+13)%13+6,tints[bv%5],bv++)}
for(let z=-24;z<=2;z+=6.5){bldg(-24,z,6,5.6,14+((z*5)%11+11)%11*1.6,tints[bv%5],bv++);bldg(24,z,6,5.6,16+((z*3)%9+9)%9*2,tints[bv%5],bv++)}
for(let x=-16;x<=16;x+=8){if(Math.abs(x)<10)continue;bldg(x,-27,7,6,26+Math.abs(x),tints[bv%5],bv++)}
bldg(0,-29,14,4,34,'#b8c4d6',bv++);

/* 거래소 건물 + 대형 시세판 */
const stone='#e7e2d6',stone2='#d4cebf';
box(28,.3,3.2,stone2,0,.15,-12.4);box(27,.3,2.6,stone2,0,.45,-12.8);box(26,.3,2,stone2,0,.75,-13.2);
box(26,15,7,stone,0,7.5,-18);
box(27,.9,1.4,stone2,0,15.2,-14.6);for(let i=0;i<4;i++)box(26-i*6,.8,1.2,stone,0,16+i*.8,-14.7);
for(const x of [-12.4,12.4]){box(1.2,14,1.2,'#f4f1ea',x,7.5,-14.4)}
rects.push({x0:-13,x1:13,z0:-21.5,z1:-13.9});
/* 시세판 캔버스 */
const BC=document.createElement('canvas');BC.width=2048;BC.height=1024;
const bigT=new THREE.CanvasTexture(BC);bigT.colorSpace=THREE.SRGBColorSpace;bigT.anisotropy=8;
box(23.4,11.4,.5,'#2b3139',0,7,-14.15);
const scr=new THREE.Mesh(BOX,[dark2(),dark2(),dark2(),dark2(),new THREE.MeshBasicMaterial({map:bigT}),dark2()]);scr.scale.set(22.4,11.2,.2);scr.position.set(0,7,-13.85);scene.add(scr);
function dark2(){return M('#111')}
const UP='#0ecb81',DN='#f6465d',Y='#fcd535',INK='#eaecef',MU='#848e9c',P1='#181a20',P2='#1e2329';
let K15=[];
async function sync15(){for(const h of['https://api.binance.com','https://data-api.binance.vision']){
  try{const r=await fetch(h+'/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=96');if(!r.ok)continue;
    K15=(await r.json()).map(k=>[k[0],+k[1],+k[2],+k[3],+k[4]]);dirty=true;return}catch(e){}}}
sync15();setInterval(sync15,60000);
function live15(c){if(!K15.length)return;let l=K15[K15.length-1];
  if(Date.now()>=l[0]+900000){l=[l[0]+900000,l[4],c,c,c];K15.push(l);if(K15.length>96)K15.shift()}
  l[4]=c;if(c>l[2])l[2]=c;if(c<l[3])l[3]=c}
function rr(g,x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill()}
function tx(g,s,x,y,font,c,al){g.font=font+' Pretendard, system-ui, sans-serif';g.fillStyle=c;g.textAlign=al||'left';g.fillText(s,x,y)}
const p2=n=>String(n).padStart(2,'0');
function drawBig(){
  const g=BC.getContext('2d'),W=2048,H=1024,t=dayN(todayKST());
  g.fillStyle='#0b0e11';g.fillRect(0,0,W,H);g.textBaseline='middle';

  if(kind==='pos'){const o=other(m.id,name);o.tx=+m.x||0;o.ty=+m.y||0;o.tz=+m.z||0;o.tr=+m.r||0;if(!o.init){o.init=true;o.a.P.position.set(o.tx,o.ty,o.tz)}}
  else if(kind==='hello'){const fresh=!others.has(m.id);other(m.id,name);if(fresh)log('',(name||'친구')+'님이 들어왔어요',true);sendPos(true)}
  else if(kind==='chat'&&typeof m.t==='string'){const o=other(m.id,name);const txt=m.t.slice(0,80);say(o.tag,txt);log(o.name,txt)}
  else if(kind==='bye'){const o=others.get(m.id);if(o)log('',o.name+'님이 나갔어요',true);drop(m.id)}}
const brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];let bk=0,closing=false;
function connect(){
  if(!window.mqtt){$('netT').textContent='채팅 불가';log('','채팅 모듈을 불러오지 못했어요. 새로고침해 주세요.',true);return}
  closing=false;
  try{client=mqtt.connect(brokers[bk%brokers.length],{clientId:'bs_'+myId+'_'+bk,clean:true,connectTimeout:8000,reconnectPeriod:0,keepalive:30,
    will:{topic:TOPIC+'/bye',payload:JSON.stringify({id:myId}),qos:0,retain:false}})}catch(e){bk++;setTimeout(connect,3000);return}
  client.on('connect',()=>{online=true;setNet();client.subscribe(TOPIC+'/#');pub('hello',{id:myId,n:myName});sendPos(true)});
  client.on('message',onMsg);
  client.on('error',()=>{});
  client.on('close',()=>{if(closing)return;closing=true;online=false;setNet();try{client.end(true)}catch(e){}bk++;setTimeout(connect,3000)});
}
addEventListener('pagehide',()=>{pub('bye',{id:myId})});

/* 채팅 입력 */
const bar=$('bar'),msg=$('msg');
function openChat(){bar.classList.add('on');msg.focus()}
function closeChat(){bar.classList.remove('on');msg.blur()}
$('chatBtn').addEventListener('click',openChat);
$('boardBtn').addEventListener('click',()=>{$('big').classList.add('on');$('bigC').getContext('2d').drawImage(BC,0,0)});
$('bigX').addEventListener('click',()=>$('big').classList.remove('on'));$('barX').addEventListener('click',closeChat);
bar.addEventListener('submit',e=>{e.preventDefault();const t=msg.value.trim().slice(0,80);if(!t){closeChat();return}
  msg.value='';say(myTag,t);log(myName,t);if(online)pub('chat',{id:myId,n:myName,t});else log('','아직 채팅 서버에 연결 중이에요',true);closeChat()});

/* ================= 조작 ================= */
const keys={};
const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT';
addEventListener('keydown',e=>{if(typing())return;if(e.code==='Enter'||e.code==='KeyT'){e.preventDefault();if($('start').style.display==='none')openChat();return}
  keys[e.code]=true;if(e.code==='Space')jump()});
addEventListener('keyup',e=>{keys[e.code]=false});
let jx=0,jz=0,joyId=null;const joy=$('joy'),knob=$('knob');
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),max=r.width/2-12;if(m>max){dx*=max/m;dy*=max/m}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/max;jz=dy/max}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;jx=jz=0;knob.style.transform=''};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
let vy=0,onGround=true;
function jump(){if(onGround){vy=7.2;onGround=false}}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
let yaw=0,pitch=.32,dragId=null,lx=0,ly=0,zoom=11;
cv.addEventListener('pointerdown',e=>{if(bar.classList.contains('on'))closeChat();dragId=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==dragId)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(.2,Math.min(1.2,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
const dragEnd=e=>{if(e.pointerId===dragId)dragId=null};
cv.addEventListener('pointerup',dragEnd);cv.addEventListener('pointercancel',dragEnd);
cv.addEventListener('wheel',e=>{zoom=Math.max(5,Math.min(18,zoom+e.deltaY*.01))},{passive:true});

/* ================= 시작 화면 ================= */
try{$('nick').value=localStorage.getItem('btc-street-nick')||''}catch(e){}
$('startF').addEventListener('submit',e=>{e.preventDefault();
  myName=($('nick').value.trim()||'트레이더'+myId.slice(0,3)).slice(0,10);
  try{localStorage.setItem('btc-street-nick',myName)}catch(er){}
  myTag=makeTag(myName,true);$('start').style.display='none';$('nick').blur();connect();setNet()});

/* ================= 루프 ================= */
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?68:55;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let lastDraw=0,near=-1,helpHidden=false;
const camT=new THREE.Vector3();
function collide(p){for(const o of colliders){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+.35;if(d<m&&d>0){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m}}
  for(const r of rects){const x0=r.x0-.35,x1=r.x1+.35,z0=r.z0-.35,z1=r.z1+.35;if(p.x>x0&&p.x<x1&&p.z>z0&&p.z<z1){
    const a=[p.x-x0,x1-p.x,p.z-z0,z1-p.z],i=a.indexOf(Math.min(...a));if(i===0)p.x=x0;else if(i===1)p.x=x1;else if(i===2)p.z=z0;else p.z=z1}}}
function loop(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  let ix=jx,iz=jz;
  if(!typing()){if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyW||keys.ArrowUp)iz-=1;if(keys.KeyS||keys.ArrowDown)iz+=1}
  const mag=Math.min(1,Math.hypot(ix,iz)),moving=mag>.08;
  if(moving){if(!helpHidden){helpHidden=true;$('help').style.opacity=0}
    const a=Math.atan2(ix,iz)+yaw,sp=5.4*mag,dx=Math.sin(a)*sp*dt,dz=Math.cos(a)*sp*dt;
    P.position.x+=dx;P.position.z+=dz;let d=Math.atan2(dx,dz)-P.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));P.rotation.y+=d*Math.min(1,dt*12)}
  collide(P.position);
  P.position.x=Math.max(-28,Math.min(28,P.position.x));P.position.z=Math.max(-14,Math.min(14,P.position.z));
  vy-=20*dt;P.position.y+=vy*dt;if(P.position.y<=0){P.position.y=0;vy=0;onGround=true}
  for(const c of cars){c.g.position.x+=c.dir*c.sp*dt;if(c.g.position.x>32)c.g.position.x=-32;if(c.g.position.x<-32)c.g.position.x=32;
    const dx=P.position.x-c.g.position.x,dz=P.position.z-c.g.position.z;
    if(Math.abs(dx)<1.55&&Math.abs(dz)<.95&&P.position.y<1.3){P.position.z=c.g.position.z+(dz>=0?.96:-.96);if(onGround){vy=4;onGround=false}}}
  animate(me,dt,moving,!onGround);
  const cx=P.position.x+Math.sin(yaw)*Math.cos(pitch)*zoom,cz=P.position.z+Math.cos(yaw)*Math.cos(pitch)*zoom,cy=P.position.y+1+Math.sin(pitch)*zoom;
  cam.position.lerp(camT.set(cx,cy,cz),Math.min(1,dt*8));cam.lookAt(P.position.x,P.position.y+3.2,P.position.z);
  const now=performance.now();
  for(const [id,o] of others){if(now-o.seen>12000){drop(id);continue}
    const p=o.a.P.position,k=Math.min(1,dt*10),dx=o.tx-p.x,dz=o.tz-p.z;
    p.x+=dx*k;p.z+=dz*k;p.y+=(o.ty-p.y)*k;let d=o.tr-o.a.P.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));o.a.P.rotation.y+=d*k;
    animate(o.a,dt,Math.hypot(dx,dz)>.05,o.ty>.05);placeTag(o.tag,o.a.P)}
  if(myTag)placeTag(myTag,P);
  if(online)sendPos(false);
  for(const c of coins){c.rotation.y+=dt*3;c.position.y=.9+Math.sin(t*2+c.position.x)*.12;
    if(Math.hypot(c.position.x-P.position.x,c.position.z-P.position.z)<.8&&Math.abs(c.position.y-(P.position.y+.9))<1.2){
      burst(c.position);score++;$('score').textContent=score;try{localStorage.setItem('btc-village-score',score)}catch(e){}placeCoin(c)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.userData.t+=dt;s.userData.v.y-=14*dt;s.position.addScaledVector(s.userData.v,dt);s.rotation.x+=dt*8;
    if(s.userData.t>.7){scene.remove(s);sparks.splice(i,1)}}
  tickT.offset.x=(tickT.offset.x+dt*.06)%1;
  if((dirty&&t-lastDraw>.5)||t-lastDraw>1){drawBig();drawTicker();lastDraw=t;dirty=false}
  R.render(scene,cam);requestAnimationFrame(loop)}
document.fonts&&document.fonts.ready.then(()=>{dirty=true});
requestAnimationFrame(loop);
}
